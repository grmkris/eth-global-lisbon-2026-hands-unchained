# Railway config-as-code (repo root — auto-discovered with the root build
# context). GitHub pushes to main deploy once the repo is connected.
# 1 replica + no sleep are load-bearing: the rig registry is in-memory.
[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/web/Dockerfile"
watchPatterns = ["apps/web/**", "bun.lock", "package.json"]

[deploy]
numReplicas = 1
sleepApplication = false
healthcheckPath = "/api/mode"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
