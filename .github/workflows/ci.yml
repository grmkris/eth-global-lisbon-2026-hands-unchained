name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14" # keep in sync with root package.json packageManager
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      - name: python driver AST
        run: |
          cd apps/driver
          for f in *.py backends/*.py sources/*.py; do
            python3 -c "import ast; ast.parse(open('$f').read())" || exit 1
          done
